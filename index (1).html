<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>روابط عمومی آموزش‌وپرورش شهرستان سیرجان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14263f;--muted:#5b6b80;--line:#d9e0e8;--accent:#0f6b63;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a28;--card:#16253a;--ink:#eaf0f6;--muted:#9fb0c3;--line:#26384f;--accent:#3fb8a8;--accent-ink:#06211e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
.wrap{max-width:520px;margin:0 auto;padding:32px 18px 40px}
header{text-align:right;margin-bottom:24px}
.mark{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:26px;margin-bottom:14px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px;line-height:1.5}
header p{margin:0;color:var(--muted);font-size:.95rem}
.group{margin:26px 0 8px;font-weight:600;font-size:.95rem;color:var(--muted)}
a.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:inherit;text-decoration:none;transition:border-color .15s}
a.link:hover{border-color:var(--accent)}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.t{font-weight:600}
.d{font-size:.85rem;color:var(--muted)}
footer{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">آ</div>
    <h1>روابط عمومی آموزش‌وپرورش شهرستان سیرجان</h1>
    <p>همه‌ی راه‌های ارتباطی و خبری یک‌جا</p>
  </header>

  <div class="group">کانال ما</div>
  <a class="link" href="https://rubika.ir/joinc/EBBBEJCC0LGNDOQYJJEIQWSJUFHFSTNA" target="_blank" rel="noopener"><span class="ic">💬</span><span><div class="t">کانال روبیکا</div><div class="d">اخبار و اطلاعیه‌های روابط عمومی</div></span></a>

  <div class="group">ارتباط با ما</div>
  <a class="link" href="mailto:Realalighasemi7856@gmail.com"><span class="ic">✉️</span><span><div class="t">ارسال ایمیل به روابط عمومی</div><div class="d">پیشنهاد، انتقاد و پیگیری</div></span></a>

  <footer>اداره آموزش‌وپرورش شهرستان سیرجان</footer>
</div>
</body>
</html>
